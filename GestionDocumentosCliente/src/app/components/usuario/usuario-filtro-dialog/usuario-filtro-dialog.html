<div class="flex items-center justify-between pr-2">
  <h2 mat-dialog-title>Filtros</h2>
  <button mat-icon-button mat-dialog-close aria-label="Cancelar"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="aplicar()">
  <mat-dialog-content class="flex! flex-col gap-1">
    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>
      <mat-select formControlName="rol" canSelectNullableOptions>
        <mat-option [value]="null">Todos</mat-option>
        @for (r of roles; track r) {
          <mat-option [value]="r" class="capitalize">{{ r }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="activo" canSelectNullableOptions>
        <mat-option [value]="null">Todos</mat-option>
        <mat-option [value]="true">Activado</mat-option>
        <mat-option [value]="false">Desactivado</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo</mat-label>
      <input matInput type="email" formControlName="correo" />
      @if (form.controls.correo.hasError('email')) {
        <mat-error>Correo inválido</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="restablecer()">Restablecer</button>
    <button matButton="filled" type="submit">Aplicar</button>
  </mat-dialog-actions>
</form>
