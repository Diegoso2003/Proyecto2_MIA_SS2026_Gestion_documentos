<div class="flex flex-col h-full w-full">
  <div class="flex flex-1 min-h-0">
    <div
      #gutter
      aria-hidden="true"
      class="pt-4 pb-8 px-4 overflow-hidden select-none text-right font-mono text-base leading-7 text-gray-500 border-r border-gray-700/50 whitespace-pre"
      [style.min-width.ch]="digitos() + 4"
    >
      {{ numeros() }}
    </div>

    <textarea
      #editor
      class="flex-1 min-w-0 p-4 pb-8 resize-none outline-none font-mono text-base leading-7 bg-transparent text-gray-200 overflow-auto"
      spellcheck="false"
      wrap="off"
      [value]="contenido()"
      [readOnly]="soloLectura()"
      (input)="onInput(editor)"
      (scroll)="sincronizarScroll(editor)"
      (click)="actualizarCursor(editor)"
      (keyup)="actualizarCursor(editor)"
      (select)="actualizarCursor(editor)"
    ></textarea>
  </div>

  <div class="flex gap-4 px-4 py-2 text-sm text-gray-400 border-t border-gray-700/50">
    <span>Ln {{ linea() }}, Col {{ columna() }}</span>
    <span class="flex-1"></span>
    @if (soloLectura()) {
      <span>Solo lectura</span>
    }
  </div>
</div>
