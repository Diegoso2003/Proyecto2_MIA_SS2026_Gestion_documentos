<div class="login-wrapper">
    <mat-card class="login-card" appearance="outlined">
        <mat-card-header>
            <mat-card-title>Iniciar sesión</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="enviar()" novalidate class="form-container">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" formControlName="correo" placeholder="correo@ejemplo.com" required />
                    <mat-icon matPrefix>email</mat-icon>
                    @if(correoEstado.invalido()){
                    <mat-error>{{correoEstado.mensaje()}}</mat-error>
                    }
                </mat-form-field>
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Contraseña</mat-label>
                    <input matInput [type]="mostrarPassword() ? 'text' : 'password'" formControlName="contraseña"
                        required />
                    <mat-icon matPrefix>lock</mat-icon>

                    <button matIconButton matSuffix type="button" (click)="clickEvent($event)"
                        [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña': 'Mostrar Contraseña'"
                        [attr.aria-pressed]="mostrarPassword()">
                        <mat-icon>{{mostrarPassword() ? 'visibility_off': 'visibility'}}</mat-icon>
                    </button>
                    @if(passwordEstado.invalido()){
                    <mat-error>{{passwordEstado.mensaje()}}</mat-error>
                    }
                </mat-form-field>
                <div class="d-flex justify-content-center mt-3">
                    <button matButton="filled" type="submit" class="w-100">
                        Iniciar sesión
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
